# Install only as /etc/nginx/sites-available/jobconnect.austattendance.online.
server {
    listen 80;
    server_name jobconnect.austattendance.online;
    root /home/s20210104034/laravel/public;
    index index.php;
    client_max_body_size 16m;
    server_tokens off;
    access_log /var/log/nginx/s20210104034-access.log;
    error_log /var/log/nginx/s20210104034-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /app/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /app/index.html {
        add_header Cache-Control "no-store";
    }
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-s20210104034.sock;
        fastcgi_param HTTP_PROXY "";
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
