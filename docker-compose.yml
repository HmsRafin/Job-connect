# Local / private host only. Never run this on the shared class VPS.
name: jobconnect

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jobconnect_db
      MYSQL_USER: jobconnect
      MYSQL_PASSWORD: "${DB_PASSWORD:?Run scripts/init-docker-env.ps1 first}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Run scripts/init-docker-env.ps1 first}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -Nse 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      APP_NAME: JobConnect
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Run scripts/init-docker-env.ps1 first}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      FRONTEND_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: jobconnect_db
      DB_USERNAME: jobconnect
      DB_PASSWORD: "${DB_PASSWORD:?Run scripts/init-docker-env.ps1 first}"
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      PAYMENTS_MODE: demo
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/jobconnect-fpm-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      - storage-data:/var/www/html/storage:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health && wget -q -O /dev/null http://127.0.0.1/app/index.html"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  mysql-data:
  storage-data:
